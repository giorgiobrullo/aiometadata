name: Build custom image

# The fork's own image: upstream's release plus the patches on custom-patches, for the
# cursedkarma k3s deployment (amd64 only, the node it runs on).
on:
  push:
    branches:
      - custom-patches
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/aiometadata:custom
            ghcr.io/${{ github.repository_owner }}/aiometadata:custom-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
